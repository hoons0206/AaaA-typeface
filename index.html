<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiePen Font Tester</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* flex를 쓰지 않고 일반 인라인 흐름으로 둔다 (calt가 이웃 글자를 보려면 필요) */
    .text-container {
      font-size: 3.5rem;
      text-align: center;
      line-height: 1.4;
      padding: 20px;
      min-height: 120px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* 글자 span: inline 유지 (inline-block/transform 금지) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

  <script>
    // 1. 큰따옴표("")를 백틱(``)으로 변경하여 자바스크립트 줄 바꿈 문법 오류를 해결했습니다.
    const testText = `AaaA is a typeface th4t s3parates the 1dentity of a character fr0m its v1sual form.<br>In ordinary typogr4phy, every letter carries its own shape, its own identity, its own place in the alph4bet.<br>A is A, B is B, C is C. AaaA br3aks this rel4tionship apart.<br>The letters begin to look alike, while their identities sl1p somewhere else, 01tside the visible form.`;
      
    const container = document.getElementById('text-container');

    function runAnimation() {
      container.innerHTML = '';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      let charIndex = 0;

      // 2. 타이핑 애니메이션 실행 함수
      const typeInterval = setInterval(() => {
        if (charIndex < testText.length) {
          // 현재 위치가 <br> 태그의 시작인 경우, 한 글자씩 쪼개지 않고 통째로 처리합니다.
          if (testText.substring(charIndex, charIndex + 4) === '<br>') {
            const br = document.createElement('br');
            container.appendChild(br);
            charIndex += 4; // <br>의 길이인 4만큼 인덱스를 건너뜁니다.
          } else {
            const span = document.createElement('span');
            span.className = 'char font-helvetica';
            span.textContent = testText[charIndex];
            container.appendChild(span);
            charIndex++;
          }
        } else {
          clearInterval(typeInterval);
          container.appendChild(cursor);
          setTimeout(changeFontOneByOne, 500);
        }
      }, 70);
    }

    function changeFontOneByOne() {
      // .char 클래스를 가진 요소(실제 글자들)만 골라내어 폰트 변경을 진행합니다. (<br> 태그는 제외됨)
      const spans = container.querySelectorAll('.char');
      let index = 0;

      // 3. 한 글자씩 IndiePen으로 교체
      const changeInterval = setInterval(() => {
        if (index < spans.length) {
          const span = spans[index];
          span.classList.add('changing');

          setTimeout(() => {
            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');
            span.classList.remove('changing');
          }, 100);

          index++;
        } else {
          clearInterval(changeInterval);
          setTimeout(runAnimation, 3000);
        }
      }, 90);
    }

    window.onload = runAnimation;
  </script>
</body>
</html>
