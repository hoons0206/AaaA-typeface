<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* flex를 쓰지 않고 일반 인라인 흐름으로 둔다 (calt가 이웃 글자를 보려면 필요) */
  .text-container {
  font-size: 3.5rem;
  text-align: center;
  line-height: 1.4;
  padding: 80px 20px;
  min-height: 120px;
  width: 100%;
  white-space: pre-wrap;
  word-break: break-word;
}

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* 글자 span: inline 유지 (inline-block/transform 금지) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

 <script>
  const testText = `AaaA is a type:face th4t s3parates the 1dentity of @a character fr0m its v1sual form.<br>
In or+dinary typogr4phy,) every letter carrie(s its own shape, its own identity, its own pl^ace in the alph4bet.<br>
A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#<br>
The letters begin to look alike, while their ide;ntities sl1p somewhere else, 01tside the visible form.`;

  const secondText = `Try typing it yourself!`;

  const container = document.getElementById('text-container');

  let changeTimeout = null;


  function runAnimation() {

    // 기존 타이머가 있다면 제거
    if (changeTimeout) {
      clearTimeout(changeTimeout);
    }

    container.innerHTML = '';

    let charIndex = 0;


    // ==========================================
    // 설명 문장: 기존과 동일하게 2초 후 변환 시작
    // ==========================================

    changeTimeout = setTimeout(() => {
      changeFontOneByOne();
    }, 2000);


    // ==========================================
    // 1. 설명 문장 Helvetica 타이핑
    // ==========================================

    const typeInterval = setInterval(() => {

      if (charIndex < testText.length) {

        // <br> 처리
        if (testText.substring(charIndex, charIndex + 4) === '<br>') {

          const br = document.createElement('br');
          container.appendChild(br);

          charIndex += 4;

        } else {

          const span = document.createElement('span');

          span.className = 'char font-helvetica';
          span.textContent = testText[charIndex];

          container.appendChild(span);

          charIndex++;
        }

      } else {

        clearInterval(typeInterval);


        // ==========================================
        // 설명 문장 타이핑 완료
        // 1.5초 기다린 후 두 번째 문장 시작
        // ==========================================

        setTimeout(() => {
          typeSecondText();
        }, 1500);
      }

    }, 70);


    // ==========================================
    // 설명 문장 → IndiePen 변환
    // 기존 방식
    // ==========================================

    function changeFontOneByOne() {

      let index = 0;

      const changeInterval = setInterval(() => {

        // 현재 존재하는 글자들을 다시 가져옴
        const spans = container.querySelectorAll('.char');

        if (index < spans.length) {

          const span = spans[index];

          span.classList.add('changing');

          setTimeout(() => {

            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');

            span.classList.remove('changing');

          }, 100);

          index++;

        } else {

          // 아직 타이핑 중이면 잠시 기다림
          const totalTargetChars =
            testText.replace(/<br>/g, '').length;

          if (index >= totalTargetChars) {

            clearInterval(changeInterval);
          }
        }

      }, 90);
    }


    // ==========================================
    // 2. "Try typing it yourself!" 타이핑
    // ==========================================

    function typeSecondText() {

      let secondIndex = 0;

      const secondTypeInterval = setInterval(() => {

        if (secondIndex < secondText.length) {

          const span = document.createElement('span');

          span.className = 'char font-helvetica';
          span.textContent = secondText[secondIndex];

          container.appendChild(span);

          secondIndex++;

        } else {

          clearInterval(secondTypeInterval);


          // ==========================================
          // 두 번째 문장 타이핑 완료
          // 짧게 기다린 후 빠르게 IndiePen 변환
          // ==========================================

          setTimeout(() => {
            changeSecondFont();
          }, 200);
        }

      }, 35);
    }


    // ==========================================
    // 3. "Try typing it yourself!" 빠른 변환
    // ==========================================

    function changeSecondFont() {

      const spans = container.querySelectorAll('.char');

      const firstTextLength =
        testText.replace(/<br>/g, '').length;

      // 설명 문장 이후의 글자만 선택
      const secondSpans =
        Array.from(spans).slice(firstTextLength);

      let index = 0;


      const changeInterval = setInterval(() => {

        if (index < secondSpans.length) {

          const span = secondSpans[index];

          span.classList.add('changing');

          setTimeout(() => {

            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');

            span.classList.remove('changing');

          }, 40);

          index++;

        } else {

          clearInterval(changeInterval);


          // ==========================================
          // 전체 애니메이션 다시 시작
          // ==========================================

          setTimeout(() => {
            runAnimation();
          }, 3000);
        }

      }, 35);
    }

  }


  window.onload = runAnimation;
</script>
</body>
</html>
