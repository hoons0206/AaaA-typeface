<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>

  <style>

    /* ==========================================
       폰트
       ========================================== */

    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }


    /* ==========================================
       전체 초기화
       ========================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ==========================================
       BODY
       ========================================== */

    body {
      background-color: #ffffff;
      color: #000000;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      /* 가로 스크롤 방지 */
      overflow-x: hidden;

      /* 세로 스크롤 허용 */
      overflow-y: auto;
    }


    /* ==========================================
       텍스트 전체 영역
       
       flex를 쓰지 않고 일반 인라인 흐름으로 둔다.
       IndiePen의 calt가 이웃 글자를 인식하려면
       일반적인 텍스트 흐름이 필요하다.
       ========================================== */

    .text-container {

      /* ★ 글자 크기 */
      font-size: 3.4rem;

      text-align: left;

      /* ★ 행간
         1.0 = 좁음
         1.1 = 현재
         1.3 = 조금 넓음
         1.5 = 넓음 */
      line-height: 1.1;

      padding: 80px 20px;

      min-height: 120px;
      width: 100%;

      white-space: pre-wrap;
      word-break: break-word;
    }


    /* ==========================================
       Helvetica
       ========================================== */

    .font-helvetica {
      font-family:
        'Helvetica Neue',
        Helvetica,
        Arial,
        sans-serif;

      font-weight: bold;
    }


    /* ==========================================
       IndiePen
       ========================================== */

    .font-indiepen {
      font-family:
        'IndiePen',
        'Helvetica Neue',
        Helvetica,
        sans-serif;

      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;

      /* ★ OpenType contextual alternates */
      font-feature-settings: "calt" 1;
    }


    /* ==========================================
       각각의 글자
       ========================================== */

    .char {

      /* inline 유지 */
      position: relative;

      top: 0;

      /* ★ 글자가 위로 튀는 애니메이션 속도

         0.15s = 현재
         0.3s  = 느리게
         0.05s = 빠르게 */
      transition: top 0.3s ease;
    }


    /* ==========================================
       IndiePen으로 변환될 때
       글자가 살짝 위로 튀어 오름
       ========================================== */

    .char.changing {

      /* ★ 위로 올라가는 거리

         -0.12em = 현재
         -0.05em = 조금 움직임
         -0.2em  = 많이 움직임 */
      top: -0.05em;
    }


    /* ==========================================
       커서
       ========================================== */

    .cursor {
      display: inline-block;

      width: 3px;

      /* ★ 커서 높이 */
      height: 3.5rem;

      background-color: #000000;

      margin-left: 4px;

      /* ★ 커서 깜빡임 속도

         0.8s = 현재
         0.5s = 빠르게
         1.2s = 느리게 */
      animation: blink 0.8s infinite;

      vertical-align: middle;
    }


    /* ==========================================
       커서 깜빡임
       ========================================== */

    @keyframes blink {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }


    /* ==========================================
       클릭 후 입력 가능한 텍스트
       ========================================== */

    .interactive-text {

      font-family:
        'IndiePen',
        'Helvetica Neue',
        Helvetica,
        sans-serif;

      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;

      font-feature-settings: "calt" 1;

      outline: none;

      cursor: text;

      white-space: pre-wrap;

      /* ★ 클릭 후 입력 상태에서도
         자동 애니메이션과 같은 행간을 유지 */
      line-height: 1.1;
    }


    .interactive-text:focus {
      outline: none;
    }

  </style>
</head>


<body>


  <!-- ==========================================
       텍스트가 들어가는 영역
       ========================================== -->

  <div
    class="text-container"
    id="text-container">
  </div>


  <script>


    /* ==========================================
       텍스트
       ========================================== */

    const testText = `AaaA is a type:face th4t s3parates the 1dentity of<br>
@a character fr0m its v1sual form.<br>
In or+dinary typogr4phy,) every letter carrie(s its own shape, <br>
its own identity, its own pl^ace in the alph4bet.<br>
A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#.`;


    /* ==========================================
       두 번째 문장
       ========================================== */

    const secondText =
      `Try typing it yourself!`;


    /* ==========================================
       HTML 요소
       ========================================== */

    const container =
      document.getElementById('text-container');


    /* ==========================================
       타이머 변수
       ========================================== */

    let changeTimeout = null;

    let typeInterval = null;

    let changeInterval = null;

    let secondTypeInterval = null;

    let secondChangeInterval = null;


    /* ==========================================
       인터랙션 여부
       
       false = 자동 애니메이션
       true  = 사용자가 클릭해서 직접 입력
       ========================================== */

    let interactiveMode = false;



    /* ==================================================
       전체 애니메이션 시작
       ================================================== */

    function runAnimation() {


      /* 사용자가 이미 클릭했다면 다시 시작하지 않음 */

      if (interactiveMode) return;


      /* 기존 타이머 제거 */

      clearAllIntervals();


      if (changeTimeout) {

        clearTimeout(changeTimeout);

        changeTimeout = null;
      }


      /* 화면 초기화 */

      container.innerHTML = '';


      let charIndex = 0;



      /* ==================================================
         1. 설명문 타이핑
         ================================================== */

      typeInterval = setInterval(() => {


        if (interactiveMode) return;


        if (charIndex < testText.length) {


          /* ==========================================
             <br> 처리
             ========================================== */

          if (
            testText.substring(
              charIndex,
              charIndex + 4
            ) === '<br>'
          ) {

            const br =
              document.createElement('br');

            container.appendChild(br);

            charIndex += 4;


          } else {


            /* ==========================================
               일반 글자
               ========================================== */

            const span =
              document.createElement('span');

            span.className =
              'char font-helvetica';

            span.textContent =
              testText[charIndex];

            container.appendChild(span);

            charIndex++;
          }


        } else {


          /* 타이핑 완료 */

          clearInterval(typeInterval);

          typeInterval = null;
        }


      /* ==========================================
         ★ 설명문 타이핑 속도

         70ms = 현재

         숫자를 작게:
         → 빠르게 타이핑

         숫자를 크게:
         → 느리게 타이핑
         ========================================== */

      }, 60);



      /* ==================================================
         2. 설명문 IndiePen 변환 시작 대기
         ================================================== */

      changeTimeout = setTimeout(() => {


        if (!interactiveMode) {

          changeFontOneByOne();
        }


      /* ==========================================
         ★ 설명문 변환 시작까지의 대기시간

         1500ms = 1.5초

         500ms  = 0.5초
         1000ms = 1초
         2000ms = 2초
         ========================================== */

      }, 1100);

    }



    /* ==================================================
       설명문 IndiePen 변환
       ================================================== */

    function changeFontOneByOne() {


      let index = 0;


      changeInterval = setInterval(() => {


        if (interactiveMode) {

          clearInterval(changeInterval);

          return;
        }


        const spans =
          container.querySelectorAll('.char');


        if (index < spans.length) {


          const span =
            spans[index];


          /* ==========================================
             변환 애니메이션 시작
             ========================================== */

          span.classList.add('changing');


          setTimeout(() => {


            if (interactiveMode) return;


            /* Helvetica 제거 */

            span.classList.remove(
              'font-helvetica'
            );


            /* IndiePen 적용 */

            span.classList.add(
              'font-indiepen'
            );


            /* 튀어 오르는 효과 제거 */

            span.classList.remove(
              'changing'
            );


          /* ==========================================
             ★ 한 글자가 움직이기 시작한 후
             실제 IndiePen으로 바뀌기까지의 시간

             80ms = 현재

             작게 → 빠르게
             크게 → 느리게
             ========================================== */

          }, 80);


          index++;


        } else {


          /* ==========================================
             모든 글자 변환 완료
             ========================================== */

          const totalTargetChars =
            testText
              .replace(/<br>/g, '')
              .length;


          if (index >= totalTargetChars) {


            clearInterval(changeInterval);

            changeInterval = null;


            /* ==========================================
               설명문 변환 완료
               ========================================== */

            setTimeout(() => {


              if (!interactiveMode) {

                typeSecondText();
              }


            /* ==========================================
               ★ 설명문 변환 완료 후
               Try 문장 시작까지의 대기시간

               1200ms = 1.2초
               2000ms = 2초
               ========================================== */

            }, 1100);
          }
        }


      /* ==========================================
         ★ 설명문 IndiePen 변환 속도

         100ms = 현재

         이 숫자는 각 글자가
         변환되는 간격이다.

         작게 → 빠르게 변환
         크게 → 느리게 변환
         ========================================== */

      }, 73);

    }



    /* ==================================================
       Try typing it yourself!
       ================================================== */

    function typeSecondText() {


      if (interactiveMode) return;


      let secondIndex = 0;


      secondTypeInterval =
        setInterval(() => {


          if (interactiveMode) {

            clearInterval(
              secondTypeInterval
            );

            return;
          }


          if (
            secondIndex < secondText.length
          ) {


            const span =
              document.createElement('span');


            span.className =
              'char font-helvetica second-text';


            span.textContent =
              secondText[secondIndex];


            container.appendChild(span);


            secondIndex++;


          } else {


            /* ==========================================
               Try 문장 타이핑 완료
               ========================================== */

            clearInterval(
              secondTypeInterval
            );

            secondTypeInterval = null;


            setTimeout(() => {


              if (!interactiveMode) {

                changeSecondFont();
              }


            /* ==========================================
               ★ Try 문장 타이핑 완료 후
               IndiePen 변환까지 기다리는 시간

               1500ms = 1.5초
               ========================================== */

            }, 1100);

          }


        /* ==========================================
           ★ Try 문장 타이핑 속도

           35ms = 현재

           작게 → 빠르게
           크게 → 느리게
           ========================================== */

        }, 35);

    }



    /* ==================================================
       Try 문장 빠른 IndiePen 변환
       ================================================== */

    function changeSecondFont() {


      if (interactiveMode) return;


      const spans =
        container.querySelectorAll('.char');


      const firstTextLength =
        testText
          .replace(/<br>/g, '')
          .length;


      const secondSpans =
        Array.from(spans)
          .slice(firstTextLength);


      let index = 0;


      secondChangeInterval =
        setInterval(() => {


          if (interactiveMode) {

            clearInterval(
              secondChangeInterval
            );

            return;
          }


          if (
            index < secondSpans.length
          ) {


            const span =
              secondSpans[index];


            /* 변환 애니메이션 시작 */

            span.classList.add(
              'changing'
            );


            setTimeout(() => {


              if (interactiveMode) return;


              /* Helvetica 제거 */

              span.classList.remove(
                'font-helvetica'
              );


              /* IndiePen 적용 */

              span.classList.add(
                'font-indiepen'
              );


              /* 움직임 제거 */

              span.classList.remove(
                'changing'
              );


            /* ==========================================
               ★ Try 문장의 개별 글자가
               실제 IndiePen으로 바뀌기까지의 시간

               35ms = 현재
               ========================================== */

            }, 20);


            index++;


          } else {


            /* ==========================================
               전체 애니메이션 완료
               ========================================== */

            clearInterval(
              secondChangeInterval
            );

            secondChangeInterval = null;


            setTimeout(() => {


              if (!interactiveMode) {

                runAnimation();
              }


            /* ==========================================
               ★ 전체 애니메이션이 끝난 후
               처음부터 다시 시작하기까지의 시간

               3000ms = 3초
               ========================================== */

            }, 3000);

          }


        /* ==========================================
           ★ Try 문장 IndiePen 변환 속도

           25ms = 현재

           숫자를 작게:
           → 매우 빠르게 변환

           숫자를 크게:
           → 느리게 변환
           ========================================== */

        }, 25);

    }



    /* ==================================================
       화면 클릭
       
       클릭하면:
       1. 자동 애니메이션 정지
       2. 지금까지 나온 텍스트 유지
       3. 클릭한 위치에 커서
       4. IndiePen으로 직접 입력 가능
       
       클릭 위치 뒤의 텍스트도 삭제하지 않는다.
       ================================================== */

    container.addEventListener(
      'click',
      function(event) {


        /* 이미 인터랙티브 상태라면 무시 */

        if (interactiveMode) return;


        const target =
          event.target.closest('.char');


        /* 글자를 클릭하지 않았다면 무시 */

        if (!target) return;


        activateInteractiveMode(event);

      }
    );



    /* ==================================================
       인터랙티브 모드
       ================================================== */

    function activateInteractiveMode(event) {


      /* ==========================================
         자동 애니메이션 종료 상태
         ========================================== */

      interactiveMode = true;


      /* ==========================================
         모든 자동 타이핑 / 폰트 변환 즉시 중지
         ========================================== */

      clearAllIntervals();


      if (changeTimeout) {

        clearTimeout(changeTimeout);

        changeTimeout = null;
      }



      /* ==========================================
         현재 화면의 모든 글자 가져오기
         ========================================== */

      const spans =
        Array.from(
          container.querySelectorAll('.char')
        );


      if (spans.length === 0) return;



      /* ==========================================
         클릭한 글자 확인
         ========================================== */

      const clickedSpan =
        event.target.closest('.char');


      if (!clickedSpan) return;



      /* ==========================================
         클릭한 글자의 어느 위치를 눌렀는지 계산
         ========================================== */

      const rect =
        clickedSpan.getBoundingClientRect();


      const middle =
        rect.left +
        rect.width / 2;


      let clickedIndex =
        spans.indexOf(clickedSpan);



      /*
       * 글자의 왼쪽을 클릭하면 글자 앞,
       * 오른쪽을 클릭하면 글자 뒤에 커서를 놓는다.
       */

      if (event.clientX >= middle) {

        clickedIndex++;
      }



      /* ==========================================
         현재 화면의 모든 텍스트를 하나로 만들기
         ========================================== */

      let fullText = '';


      const nodes =
        Array.from(
          container.childNodes
        );


      for (const node of nodes) {


        /* 줄바꿈 */

        if (node.nodeName === 'BR') {

          fullText += '\n';


        /* 일반 글자 */

        } else if (
          node.nodeType === Node.ELEMENT_NODE &&
          node.classList.contains('char')
        ) {

          fullText += node.textContent;
        }
      }



      /* ==========================================
         클릭한 위치에 해당하는 문자 위치 계산
         ========================================== */

      let cursorPosition = 0;


      for (
        let i = 0;
        i < clickedIndex;
        i++
      ) {

        cursorPosition +=
          spans[i].textContent.length;
      }



      /* ==========================================
         기존 텍스트는 전부 유지
         ========================================== */

      container.innerHTML = '';



      /* ==========================================
         하나의 contenteditable 영역으로 전환
         ========================================== */

      const editable =
        document.createElement('span');


      editable.className =
        'interactive-text';


      editable.contentEditable =
        'true';


      editable.spellcheck =
        false;


      /* 현재까지 타이핑된 텍스트를 그대로 유지 */

      editable.textContent =
        fullText;


      container.appendChild(
        editable
      );



      /* ==========================================
         IndiePen 적용
         ========================================== */

      editable.style.fontFamily =
        "'IndiePen', 'Helvetica Neue', Helvetica, sans-serif";


      editable.style.fontFeatureSettings =
        '"calt" 1';



      /* ==========================================
         클릭했던 위치에 커서 배치
         ========================================== */

      editable.focus();


      const selection =
        window.getSelection();


      const range =
        document.createRange();


      const textNode =
        editable.firstChild;


      if (textNode) {


        const safePosition =
          Math.min(
            cursorPosition,
            textNode.length
          );


        range.setStart(
          textNode,
          safePosition
        );


        range.collapse(true);


        selection.removeAllRanges();

        selection.addRange(range);
      }

    }



    /* ==================================================
       모든 자동화 중지
       ================================================== */

    function clearAllIntervals() {


      /* 설명문 타이핑 */

      if (typeInterval) {

        clearInterval(
          typeInterval
        );

        typeInterval = null;
      }


      /* 설명문 IndiePen 변환 */

      if (changeInterval) {

        clearInterval(
          changeInterval
        );

        changeInterval = null;
      }


      /* Try 문장 타이핑 */

      if (secondTypeInterval) {

        clearInterval(
          secondTypeInterval
        );

        secondTypeInterval = null;
      }


      /* Try 문장 IndiePen 변환 */

      if (secondChangeInterval) {

        clearInterval(
          secondChangeInterval
        );

        secondChangeInterval = null;
      }

    }



    /* ==================================================
       페이지 로딩 후 애니메이션 시작
       ================================================== */

    window.onload =
      runAnimation;


  </script>

</body>
</html>
