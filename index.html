<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* flex를 쓰지 않고 일반 인라인 흐름으로 둔다 (calt가 이웃 글자를 보려면 필요) */
  .text-container {
  font-size: 3.5rem;
  text-align: center;
  line-height: 1.4;
  padding: 80px 20px;
  min-height: 120px;
  width: 100%;
  white-space: pre-wrap;
  word-break: break-word;
}

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* 글자 span: inline 유지 (inline-block/transform 금지) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .interactive-text {
  font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
  font-weight: normal;
  font-synthesis: none;
  font-palette: normal;
  font-feature-settings: "calt" 1;

  outline: none;
  cursor: text;
  white-space: pre-wrap;
}

.interactive-text:focus {
  outline: none;
}

    .interactive-text {
  font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
  font-weight: normal;
  font-synthesis: none;
  font-palette: normal;
  font-feature-settings: "calt" 1;

  outline: none;
  cursor: text;
  white-space: pre-wrap;
}

.interactive-text:focus {
  outline: none;
}
    
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

<script>
  const testText = `AaaA is a type:face th4t s3parates the 1dentity of @a character fr0m its v1sual form.<br>
In or+dinary typogr4phy,) every letter carrie(s its own shape, its own identity, its own pl^ace in the alph4bet.<br>
A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#<br>
The letters begin to look alike, while their ide;ntities sl1p somewhere else, 01tside the visible form.`;

  const secondText = `Try typing it yourself!`;

  const container = document.getElementById('text-container');

  let changeTimeout = null;

  let typeInterval = null;
  let changeInterval = null;
  let secondTypeInterval = null;
  let secondChangeInterval = null;

  let interactiveMode = false;


  // ==========================================
  // 전체 애니메이션 시작
  // ==========================================

  function runAnimation() {

    if (interactiveMode) return;

    clearAllIntervals();

    if (changeTimeout) {
      clearTimeout(changeTimeout);
    }

    container.innerHTML = '';

    let charIndex = 0;


    // ==========================================
    // 1. 설명문 타이핑
    // ==========================================

    typeInterval = setInterval(() => {

      if (interactiveMode) return;

      if (charIndex < testText.length) {

        if (
          testText.substring(charIndex, charIndex + 4) === '<br>'
        ) {

          const br = document.createElement('br');
          container.appendChild(br);

          charIndex += 4;

        } else {

          const span = document.createElement('span');

          span.className = 'char font-helvetica';
          span.textContent = testText[charIndex];

          container.appendChild(span);

          charIndex++;
        }

      } else {

        clearInterval(typeInterval);
        typeInterval = null;
      }

    }, 70);


    // ==========================================
    // 2. 2초 후 설명문 IndiePen 변환
    // ==========================================

    changeTimeout = setTimeout(() => {

      if (!interactiveMode) {
        changeFontOneByOne();
      }

    }, 2000);
  }


  // ==========================================
  // 설명문 IndiePen 변환
  // ==========================================

  function changeFontOneByOne() {

    let index = 0;

    changeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(changeInterval);
        return;
      }

      const spans =
        container.querySelectorAll('.char');

      if (index < spans.length) {

        const span = spans[index];

        span.classList.add('changing');

        setTimeout(() => {

          if (interactiveMode) return;

          span.classList.remove('font-helvetica');
          span.classList.add('font-indiepen');
          span.classList.remove('changing');

        }, 100);

        index++;

      } else {

        const totalTargetChars =
          testText.replace(/<br>/g, '').length;

        if (index >= totalTargetChars) {

          clearInterval(changeInterval);
          changeInterval = null;

          // 설명문 변환 완료
          // 1.5초 후 Try 문장 시작

          setTimeout(() => {

            if (!interactiveMode) {
              typeSecondText();
            }

          }, 1500);
        }
      }

    }, 50);
  }


  // ==========================================
  // Try typing it yourself!
  // ==========================================

  function typeSecondText() {

    if (interactiveMode) return;

    let secondIndex = 0;

    secondTypeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(secondTypeInterval);
        return;
      }

      if (secondIndex < secondText.length) {

        const span = document.createElement('span');

        span.className =
          'char font-helvetica second-text';

        span.textContent =
          secondText[secondIndex];

        container.appendChild(span);

        secondIndex++;

      } else {

        clearInterval(secondTypeInterval);
        secondTypeInterval = null;

        // Try 문장 타이핑 완료
        // 1.5초 후 IndiePen 변환

        setTimeout(() => {

          if (!interactiveMode) {
            changeSecondFont();
          }

        }, 1500);
      }

    }, 35);
  }


  // ==========================================
  // Try 문장 빠른 IndiePen 변환
  // ==========================================

  function changeSecondFont() {

    if (interactiveMode) return;

    const spans =
      container.querySelectorAll('.char');

    const firstTextLength =
      testText.replace(/<br>/g, '').length;

    const secondSpans =
      Array.from(spans).slice(firstTextLength);

    let index = 0;

    secondChangeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(secondChangeInterval);
        return;
      }

      if (index < secondSpans.length) {

        const span = secondSpans[index];

        span.classList.add('changing');

        setTimeout(() => {

          if (interactiveMode) return;

          span.classList.remove('font-helvetica');
          span.classList.add('font-indiepen');
          span.classList.remove('changing');

        }, 40);

        index++;

      } else {

        clearInterval(secondChangeInterval);
        secondChangeInterval = null;

        // 전체 완료 후 3초 뒤 반복

        setTimeout(() => {

          if (!interactiveMode) {
            runAnimation();
          }

        }, 3000);
      }

    }, 35);
  }


  // ==========================================
  // ★ 화면 어디를 클릭해도 인터랙션
  // ==========================================

  container.addEventListener('click', function(event) {

    if (interactiveMode) return;

    const target =
      event.target.closest('.char');

    if (!target) return;

    activateInteractiveMode(event);
  });


  // ==========================================
  // 인터랙티브 모드
  // ==========================================

  function activateInteractiveMode(event) {

  interactiveMode = true;

  // ==========================================
  // 모든 자동 타이핑 / 폰트 변환 즉시 중지
  // ==========================================

  clearAllIntervals();

  if (changeTimeout) {
    clearTimeout(changeTimeout);
    changeTimeout = null;
  }


  // ==========================================
  // 현재 화면의 모든 글자를 가져온다
  // ==========================================

  const spans =
    Array.from(container.querySelectorAll('.char'));

  if (spans.length === 0) return;


  // ==========================================
  // 클릭한 글자 확인
  // ==========================================

  const clickedSpan =
    event.target.closest('.char');

  if (!clickedSpan) return;


  // ==========================================
  // 클릭한 글자의 어느 위치를 눌렀는지 계산
  // ==========================================

  const rect =
    clickedSpan.getBoundingClientRect();

  const middle =
    rect.left + rect.width / 2;

  let clickedIndex =
    spans.indexOf(clickedSpan);


  /*
   * 글자의 왼쪽을 클릭하면 글자 앞,
   * 오른쪽을 클릭하면 글자 뒤
   */

  if (event.clientX >= middle) {
    clickedIndex++;
  }


  // ==========================================
  // 현재 화면의 모든 텍스트를 하나로 만든다
  // ==========================================

  let fullText = '';

  const nodes =
    Array.from(container.childNodes);

  for (const node of nodes) {

    if (node.nodeName === 'BR') {

      fullText += '\n';

    } else if (
      node.nodeType === Node.ELEMENT_NODE &&
      node.classList.contains('char')
    ) {

      fullText += node.textContent;
    }
  }


  // ==========================================
  // 클릭한 위치에 해당하는 문자 위치 계산
  // ==========================================

  let cursorPosition = 0;

  for (let i = 0; i < clickedIndex; i++) {

    cursorPosition += spans[i].textContent.length;
  }


  // ==========================================
  // 기존 텍스트를 전부 유지한다
  // ==========================================

  container.innerHTML = '';


  // ==========================================
  // 하나의 contenteditable 영역으로 전환
  // ==========================================

  const editable =
    document.createElement('span');

  editable.className =
    'interactive-text';

  editable.contentEditable = 'true';

  editable.spellcheck = false;

  editable.textContent = fullText;

  container.appendChild(editable);


  // ==========================================
  // IndiePen 적용
  // ==========================================

  editable.style.fontFamily =
    "'IndiePen', 'Helvetica Neue', Helvetica, sans-serif";

  editable.style.fontFeatureSettings =
    '"calt" 1';


  // ==========================================
  // 클릭했던 위치에 커서 배치
  // ==========================================

  editable.focus();

  const selection =
    window.getSelection();

  const range =
    document.createRange();

  const textNode =
    editable.firstChild;

  if (textNode) {

    const safePosition =
      Math.min(
        cursorPosition,
        textNode.length
      );

    range.setStart(
      textNode,
      safePosition
    );

    range.collapse(true);

    selection.removeAllRanges();
    selection.addRange(range);
  }
}


  // ==========================================
  // 자동화 중지
  // ==========================================

  function clearAllIntervals() {

    if (typeInterval) {
      clearInterval(typeInterval);
      typeInterval = null;
    }

    if (changeInterval) {
      clearInterval(changeInterval);
      changeInterval = null;
    }

    if (secondTypeInterval) {
      clearInterval(secondTypeInterval);
      secondTypeInterval = null;
    }

    if (secondChangeInterval) {
      clearInterval(secondChangeInterval);
      secondChangeInterval = null;
    }
  }


  window.onload = runAnimation;
</script>
</body>
</html>
