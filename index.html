<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

body {
  background-color: #ffffff;
  color: #000000;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  overflow-x: hidden;
  overflow-y: auto;
}

    /* flex를 쓰지 않고 일반 인라인 흐름으로 둔다 (calt가 이웃 글자를 보려면 필요) */
    .text-container {
      font-size: 3.5rem;
      text-align: center;
      line-height: 1.1;
      padding: 20px;
      min-height: 120px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* 글자 span: inline 유지 (inline-block/transform 금지) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

  <script>
    const testText = `AaaA is a type:face th4t s3parates<br>
    the 1dentity of @a character fr0m its v1sual form.<br>
    In or+dinary typogr4phy,) every letter carrie(s its own shape, <br>
    its own identity, its own pl^ace in the alph4bet.<br>
    A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#`;
      
    const container = document.getElementById('text-container');
    let changeTimeout = null; // 2초 뒤 폰트 변경을 실행할 타이머 변수

    function runAnimation() {
      // 애니메이션 초기화 시 기존 예약된 타이머가 있다면 취소합니다.
      if (changeTimeout) clearTimeout(changeTimeout);
      
      container.innerHTML = '';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      let charIndex = 0;

      // [수정] 타이핑 애니메이션이 '시작되자마자' 2초(2000ms) 카운트다운을 시작합니다.
      changeTimeout = setTimeout(changeFontOneByOne, 1100);

      // 1. Helvetica로 한 글자씩 타이핑
      const typeInterval = setInterval(() => {
        if (charIndex < testText.length) {
          if (testText.substring(charIndex, charIndex + 4) === '<br>') {
            const br = document.createElement('br');
            container.appendChild(br);
            charIndex += 4;
          } else {
            const span = document.createElement('span');
            span.className = 'char font-helvetica';
            span.textContent = testText[charIndex];
            container.appendChild(span);
            charIndex++;
          }
        } else {
          clearInterval(typeInterval);
          container.appendChild(cursor);
        }
      }, 70);
    }

    function changeFontOneByOne() {
      let index = 0;

      // 2. 실시간으로 계속 추가되는 .char 요소를 추적하며 한 글자씩 IndiePen으로 교체
      const changeInterval = setInterval(() => {
        // 매 인터벌마다 현재 화면에 존재하는 .char 요소들을 실시간으로 다시 가져옵니다.
        const spans = container.querySelectorAll('.char');

        if (index < spans.length) {
          const span = spans[index];
          span.classList.add('changing');

          setTimeout(() => {
            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');
            span.classList.remove('changing');
          }, 70);

          index++;
        } else {
          // 만약 index가 현재 화면의 span 개수보다 커졌는데, 전체 타이핑이 아직 안 끝났다면 
          // 다음 글자가 타이핑될 때까지 잠시 대기했다가 이어서 진행합니다.
          const totalTargetChars = testText.replace(/<br>/g, '').length;
          if (index >= totalTargetChars) {
            clearInterval(changeInterval);
            // 모든 글자 변환이 완전히 끝나면 3초 후 전체 애니메이션을 다시 재시작합니다.
            setTimeout(runAnimation, 3000);
          }
        }
      }, 90);
    }

    window.onload = runAnimation;
  </script>
</body>
</html>
