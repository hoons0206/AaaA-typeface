<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>AaaA Typeface</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src:
        url('./IndiePen-Regular-COLR.woff2') format('woff2') tech(color-COLRv1),
        url('./IndiePen-Regular-COLR.otf')   format('opentype') tech(color-COLRv1),
        url('./IndiePen-Regular-SVG.woff2')  format('woff2') tech(color-SVG),
        url('./IndiePen-Regular-SVG.otf')    format('opentype') tech(color-SVG),
        url('./IndiePen-Regular-COLR.woff2') format('woff2') tech(color-COLRv0),
        url('./IndiePen-Regular-COLR.otf')   format('opentype') tech(color-COLRv0),
        url('./IndiePen-Regular-COLR.woff2') format('woff2'),
        url('./IndiePen-Regular-COLR.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IndiePenSVG';
      src: url('./IndiePen-Regular-SVG.woff2') format('woff2'),
           url('./IndiePen-Regular-SVG.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IndiePenCOLR';
      src: url('./IndiePen-Regular-COLR.woff2') format('woff2'),
           url('./IndiePen-Regular-COLR.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* AaaA Times New Roman (컬러 폰트 아님) — 파일명의 공백은 %20으로 표기 */
    @font-face {
      font-family: 'AaaATimes';
      src: url('./AaaA%20Times%20New%20Roman-Regular.woff2') format('woff2'),
           url('./AaaA%20Times%20New%20Roman-Regular.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color-scheme: light only;
      --indiepen-family: 'IndiePen';
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      forced-color-adjust: none;
    }

    @media print {
      html, body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    html {
      background-color: #ffffff;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #ffffff;
        color: #000000;
      }
    }

    /* ---------- 첫 화면 ---------- */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scroll-hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 28px;
      text-align: center;
      font: 14px/1 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #888888;
    }

    .text-container {
      width: 100%;
      max-width: 100%;
      padding: 100px;
      font-size: 3.3rem;
      text-align: center;
      line-height: 1.1;
      white-space: pre-wrap;
    }

    .line + .line {
      margin-top: 0.3em;
    }

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: var(--indiepen-family), 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
    }

    .font-aaaa-times {
      font-family: 'AaaATimes', 'Times New Roman', Times, serif;
      font-weight: normal;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 49.9% { visibility: visible; }
      50%, 100% { visibility: hidden; }
    }

    /* ---------- 타이핑 영역 ---------- */
    .tester {
      border-top: 1px solid #000000;
    }

    .tester-row {
      display: grid;
      grid-template-columns: minmax(160px, 22vw) 1fr;
      gap: 32px;
      align-items: start;
      padding: 40px 48px;
      border-bottom: 1px solid #000000;
    }

    .tester-name {
      padding-top: 0.9rem;
      font: bold 14px/1.4 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    .tester-input {
      min-height: 1.1em;
      font-size: 3.3rem;
      line-height: 1.1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      outline: none;
      caret-color: #000000;
    }

    @media (max-width: 720px) {
      .text-container { padding: 48px 24px; font-size: 2.4rem; }
      .tester-row {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 28px 20px;
      }
      .tester-name { padding-top: 0; }
      .tester-input { font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="text-container" id="text-container"></div>
    <div class="scroll-hint">Scroll down to type</div>
  </section>

  <section class="tester" id="tester">
    <div class="tester-row">
      <div class="tester-name">AaaA IndiePen-Regular</div>
      <div class="tester-input font-indiepen" contenteditable="true"
           spellcheck="false" autocapitalize="off" autocorrect="off">AaaA br3aks this [rel4]tionship apart!</div>
    </div>

    <div class="tester-row">
      <div class="tester-name">AaaA Times New Roman-Regular</div>
      <div class="tester-input font-aaaa-times" contenteditable="true"
           spellcheck="false" autocapitalize="off" autocorrect="off">AaaA br3aks this [rel4]tionship apart!</div>
    </div>
  </section>

  <script>
    const LINES = [
      'AaaA is a type:face th4t s3parates',
      'the IDENTITY of @a character fr0m its v1sual form.',
      '"""/A is A//B is B//C is C/."""',
      'AaaA br3aks this [rel4]tionship apart!0#.'
    ];

    const container = document.getElementById('text-container');
    let changeTimeout = null;
    let typeInterval = null;
    let changeInterval = null;

    /* ---------------------------------------------------------
       컬러 폰트 감지
       --------------------------------------------------------- */
    const FAMILY_CANDIDATES = ['IndiePen', 'IndiePenSVG', 'IndiePenCOLR'];

    function getSampleChars() {
      return Array.from(new Set(LINES.join('').replace(/\s/g, ''))).join('');
    }

    function rendersColor(family, chars) {
      try {
        const size = 48;
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(chars.length * size * 1.1) + 40;
        canvas.height = size * 2;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        if (!ctx) return false;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        ctx.font = `${size}px "${family}", monospace`;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(chars, 20, size * 1.4);

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] < 40) continue;
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (Math.max(r, g, b) - Math.min(r, g, b) > 24) return true;
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    async function pickColorFontFamily() {
      if (!document.fonts || !document.fonts.load) return null;
      const chars = getSampleChars();

      for (const family of FAMILY_CANDIDATES) {
        try {
          await document.fonts.load(`48px "${family}"`, chars);
        } catch (e) {
          continue;
        }
        if (rendersColor(family, chars)) return family;
      }
      return null;
    }

    function isWebKitEngine() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const isDesktopSafari = /Safari\//.test(ua) &&
                              !/Chrome\/|Chromium\/|Edg\/|OPR\/|Android/.test(ua);
      return isIOS || isDesktopSafari;
    }

    async function prepareFont() {
      let family;

      if (isWebKitEngine()) {
        family = 'IndiePenSVG';
        try {
          await document.fonts.load(`48px "${family}"`, getSampleChars());
        } catch (e) { /* 계속 진행 */ }
        document.documentElement.dataset.engine = 'webkit';
      } else {
        family = await pickColorFontFamily();
      }

      if (family) {
        document.documentElement.style.setProperty('--indiepen-family', `"${family}"`);
      }
      document.documentElement.dataset.colorFont = family || 'none';
      console.info('[AaaA] color font family:', family || '컬러 렌더링 확인 실패 (기본 IndiePen 사용)');
    }

    /* ---------------------------------------------------------
       애니메이션
       - 줄마다 span 2개만 사용
         done    : IndiePen으로 변환이 끝난 앞부분
         pending : 타이핑됐지만 아직 Helvetica인 뒷부분
       --------------------------------------------------------- */
    function renderLine(line) {
      line.done.textContent = line.text.slice(0, line.converted);
      line.pending.textContent = line.text.slice(line.converted, line.typed);
    }

    function runAnimation() {
      clearTimeout(changeTimeout);
      clearInterval(typeInterval);
      clearInterval(changeInterval);

      container.innerHTML = '';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      const lines = [];
      let typingLine = 0;
      let convertingLine = 0;

      function ensureLine(i) {
        if (lines[i]) return lines[i];
        const div = document.createElement('div');
        div.className = 'line';
        const done = document.createElement('span');
        done.className = 'font-indiepen';
        const pending = document.createElement('span');
        pending.className = 'font-helvetica';
        div.append(done, pending);
        container.appendChild(div);
        lines[i] = { div, done, pending, text: LINES[i], typed: 0, converted: 0 };
        return lines[i];
      }

      changeTimeout = setTimeout(startConverting, 1100);

      typeInterval = setInterval(() => {
        if (typingLine < LINES.length) {
          const line = ensureLine(typingLine);
          line.typed++;
          renderLine(line);
          if (line.typed >= line.text.length) typingLine++;
        } else {
          clearInterval(typeInterval);
          lines[lines.length - 1].div.appendChild(cursor);
        }
      }, 50);

      function startConverting() {
        changeInterval = setInterval(() => {
          if (convertingLine >= LINES.length) {
            clearInterval(changeInterval);
            changeTimeout = setTimeout(runAnimation, 3000);
            return;
          }
          const line = lines[convertingLine];
          if (!line) return;
          if (line.converted < line.typed) {
            line.converted++;
            renderLine(line);
          }
          if (line.converted >= line.text.length) convertingLine++;
        }, 90);
      }
    }

    /* ---------------------------------------------------------
       타이핑 영역: 붙여넣기는 일반 텍스트로만 받음
       --------------------------------------------------------- */
    document.querySelectorAll('.tester-input').forEach((el) => {
      el.addEventListener('paste', (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
      });
    });

    /* ---------------------------------------------------------
       진단 패널: 주소 끝에 ?debug
       --------------------------------------------------------- */
    async function showDebug() {
      if (!/[?&]debug/.test(location.search)) return;

      const chars = getSampleChars();
      const panel = document.createElement('div');
      panel.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;z-index:9999;' +
        'padding:10px 14px;background:#fff;color:#000;border-top:1px solid #000;' +
        'font:12px/1.5 ui-monospace,Menlo,monospace;text-align:left;white-space:pre-wrap;';

      const supports = (q) => { try { return CSS.supports(q); } catch (e) { return 'error'; } };
      const info = document.createElement('div');
      info.textContent =
        `engine: ${document.documentElement.dataset.engine || 'other'}\n` +
        `선택된 패밀리: ${document.documentElement.dataset.colorFont}\n` +
        `font-tech(color-COLRv1): ${supports('font-tech(color-COLRv1)')}\n` +
        `font-tech(color-COLRv0): ${supports('font-tech(color-COLRv0)')}\n` +
        `font-tech(color-SVG): ${supports('font-tech(color-SVG)')}\n` +
        `UA: ${navigator.userAgent}`;
      panel.appendChild(info);

      const current = document.documentElement.dataset.colorFont;
      const testFamily = FAMILY_CANDIDATES.includes(current) ? current : 'IndiePenSVG';
      const SAMPLE = 'AaaA a4@ [rel4]tionship';
      const base = `font-family:"${testFamily}",monospace;font-size:32px;line-height:1.2;`;

      function addRow(label, build) {
        const row = document.createElement('div');
        row.style.cssText = 'margin-top:8px;';
        const l = document.createElement('div');
        l.textContent = label;
        row.appendChild(l);
        build(row);
        panel.appendChild(row);
      }

      addRow('A. 한 덩어리 텍스트', (row) => {
        const s = document.createElement('span');
        s.style.cssText = base;
        s.textContent = SAMPLE;
        row.appendChild(s);
      });

      addRow('L. 글자마다 별도 span (처음부터 IndiePen)', (row) => {
        for (const ch of SAMPLE) {
          const s = document.createElement('span');
          s.style.cssText = base;
          s.textContent = ch;
          row.appendChild(s);
        }
      });

      addRow('N. 딱 2개 span으로 분할 (앞 8글자 / 나머지)', (row) => {
        const a = document.createElement('span');
        const b = document.createElement('span');
        a.style.cssText = base;
        b.style.cssText = base;
        a.textContent = SAMPLE.slice(0, 8);
        b.textContent = SAMPLE.slice(8);
        row.append(a, b);
      });

      addRow('O. 새 방식: 앞부분 IndiePen span + 뒷부분 Helvetica span (1초 뒤 전부 IndiePen으로)', (row) => {
        const a = document.createElement('span');
        const b = document.createElement('span');
        a.style.cssText = base;
        b.style.cssText = 'font-family:Helvetica,Arial,sans-serif;font-weight:bold;font-size:32px;line-height:1.2;';
        a.textContent = SAMPLE.slice(0, 8);
        b.textContent = SAMPLE.slice(8);
        row.append(a, b);
        setTimeout(() => {
          a.textContent = SAMPLE;
          b.textContent = '';
        }, 1000);
      });

      document.body.appendChild(panel);
    }

    async function init() {
      await Promise.race([
        prepareFont(),
        new Promise(resolve => setTimeout(resolve, 4000))
      ]);
      runAnimation();
      showDebug();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
