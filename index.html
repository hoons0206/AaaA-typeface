<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 다크모드·강제 다크(자동 반전) 방지: 항상 라이트로 렌더링 -->
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>AaaA Typeface</title>
  <style>
    /* =========================================================
       컬러 폰트 로딩
       - Chrome / Edge / Samsung Internet(Chromium) : COLR (v0, v1) 지원, OT-SVG 미지원
       - Safari / iOS의 모든 브라우저(WebKit)       : OT-SVG 지원, COLRv1 미지원
       - Firefox                                    : COLR, OT-SVG 모두 지원
       → 브라우저가 지원하는 기술(tech)을 알아서 고르도록 src를 순서대로 나열
       ========================================================= */

    /* 1) 통합 패밀리: tech()로 자동 선택 + tech() 미지원 구형 브라우저용 폴백 */
    @font-face {
      font-family: 'IndiePen';
      src:
        url('./IndiePen-Regular-COLR.woff2') format('woff2') tech(color-COLRv1),
        url('./IndiePen-Regular-COLR.otf')   format('opentype') tech(color-COLRv1),
        url('./IndiePen-Regular-SVG.woff2')  format('woff2') tech(color-SVG),
        url('./IndiePen-Regular-SVG.otf')    format('opentype') tech(color-SVG),
        url('./IndiePen-Regular-COLR.woff2') format('woff2') tech(color-COLRv0),
        url('./IndiePen-Regular-COLR.otf')   format('opentype') tech(color-COLRv0),
        /* tech()를 모르는 구형 브라우저 */
        url('./IndiePen-Regular-COLR.woff2') format('woff2'),
        url('./IndiePen-Regular-COLR.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    /* 2) 개별 패밀리: 위 방식이 실패했을 때 JS가 실제로 색이 나오는 쪽을 골라 씀 */
    @font-face {
      font-family: 'IndiePenSVG';
      src: url('./IndiePen-Regular-SVG.woff2') format('woff2'),
           url('./IndiePen-Regular-SVG.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'IndiePenCOLR';
      src: url('./IndiePen-Regular-COLR.woff2') format('woff2'),
           url('./IndiePen-Regular-COLR.otf')   format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* 시스템/브라우저 다크모드가 색을 바꾸지 못하게 차단 */
      color-scheme: light only;
      /* JS가 색이 실제로 나오는 패밀리를 찾으면 이 값을 교체 */
      --indiepen-family: 'IndiePen';
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    .text-container,
    .char {
      /* Windows 고대비 모드 등 강제 색상 모드에서도 원래 색 유지 */
      forced-color-adjust: none;
      /* 인쇄/PDF 저장 시에도 색 유지 */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    html {
      background-color: #ffffff;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow-x: hidden;
      overflow-y: auto;
    }

    /* 다크모드 환경에서도 동일하게 라이트 유지 (자동 반전 대비) */
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #ffffff;
        color: #000000;
      }
    }

    .text-container {
      width: 100%;
      max-width: 100%;
      padding: 100px;

      font-size: 3.3rem;
      text-align: center;
      line-height: 1.1;

      white-space: pre-wrap;
    }

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: var(--indiepen-family), 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* WebKit(사파리/iOS) 진단용: 컬러 글리프가 검정으로 떨어질 수 있는 속성을 모두 기본값으로 되돌림 */
    html[data-engine="webkit"] .font-indiepen {
      font-synthesis: initial;
      font-palette: initial;
      font-feature-settings: normal;
    }
    html[data-engine="webkit"] .char {
      position: static;
      top: auto;
      transition: none;
    }

    /* 글자 span: inline 유지 (inline-block/transform/opacity 사용 금지: 컬러 글리프가 흑백으로 깨질 수 있음) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .line-break {
      display: block;
      height: 0.3em;
    }
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

  <script>
    // 줄바꿈은 <br> 토큰으로 구분 (템플릿 문자열 들여쓰기 공백이 섞이지 않도록 배열로 작성)
    const testText = [
      'AaaA is a type:face th4t s3parates',
      'the IDENTITY of @a character fr0m its v1sual form.',
      '"""/A is A//B is B//C is C/."""',
      'AaaA br3aks this [rel4]tionship apart!0#.'
    ].join('<br>');

    const container = document.getElementById('text-container');
    let changeTimeout = null; // 폰트 변경을 실행할 타이머 변수

    /* ---------------------------------------------------------
       컬러 폰트 감지
       - 후보 패밀리를 차례로 로드하고, canvas에 그려서
         "색이 있는 픽셀"이 실제로 나오는지 검사한 뒤 첫 번째 성공 패밀리를 사용
       --------------------------------------------------------- */
    const FAMILY_CANDIDATES = ['IndiePen', 'IndiePenSVG', 'IndiePenCOLR'];

    function getSampleChars() {
      const plain = testText.replace(/<br>/g, '').replace(/\s/g, '');
      return Array.from(new Set(plain)).join('');
    }

    function rendersColor(family, chars) {
      try {
        const size = 48;
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(chars.length * size * 1.1) + 40;
        canvas.height = size * 2;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        if (!ctx) return false;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#000000';
        ctx.font = `${size}px "${family}", monospace`;
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(chars, 20, size * 1.4);

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] < 40) continue; // 거의 투명한 픽셀은 무시
          const r = data[i], g = data[i + 1], b = data[i + 2];
          if (Math.max(r, g, b) - Math.min(r, g, b) > 24) return true; // 회색이 아님 = 컬러
        }
        return false;
      } catch (e) {
        return false;
      }
    }

    async function pickColorFontFamily() {
      if (!document.fonts || !document.fonts.load) return null;
      const chars = getSampleChars();

      for (const family of FAMILY_CANDIDATES) {
        try {
          await document.fonts.load(`48px "${family}"`, chars);
        } catch (e) {
          continue; // 파일 로드 실패 → 다음 후보
        }
        if (rendersColor(family, chars)) return family;
      }
      return null;
    }

    // Safari(macOS/iPadOS/iOS) 및 iOS의 모든 브라우저는 WebKit 엔진 → COLRv1 미지원, OT-SVG만 지원
    function isWebKitEngine() {
      const ua = navigator.userAgent;
      const isIOS = /iPad|iPhone|iPod/.test(ua) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
      const isDesktopSafari = /Safari\//.test(ua) &&
                              !/Chrome\/|Chromium\/|Edg\/|OPR\/|Android/.test(ua);
      return isIOS || isDesktopSafari;
    }

    async function prepareFont() {
      let family;

      if (isWebKitEngine()) {
        // WebKit은 canvas/tech() 판별이 불안정할 수 있어 SVG 폰트를 바로 지정
        family = 'IndiePenSVG';
        try {
          await document.fonts.load(`48px "${family}"`, getSampleChars());
        } catch (e) { /* 로드 실패 시에도 계속 진행 */ }
        document.documentElement.dataset.engine = 'webkit';
      } else {
        family = await pickColorFontFamily();
      }

      if (family) {
        document.documentElement.style.setProperty('--indiepen-family', `"${family}"`);
      }
      document.documentElement.dataset.colorFont = family || 'none';
      console.info('[AaaA] color font family:', family || '컬러 렌더링 확인 실패 (기본 IndiePen 사용)');
    }

    /* --------------------------------------------------------- */

    function runAnimation() {
      // 애니메이션 초기화 시 기존 예약된 타이머가 있다면 취소합니다.
      if (changeTimeout) clearTimeout(changeTimeout);

      container.innerHTML = '';

      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      let charIndex = 0;

      // 타이핑 애니메이션이 '시작되자마자' 1.1초(1100ms) 카운트다운을 시작합니다.
      changeTimeout = setTimeout(changeFontOneByOne, 1100);

      // 1. Helvetica로 한 글자씩 타이핑
      const typeInterval = setInterval(() => {
        if (charIndex < testText.length) {
          if (testText.substring(charIndex, charIndex + 4) === '<br>') {
            const br = document.createElement('span');
            br.className = 'line-break';
            container.appendChild(br);
            charIndex += 4;
          } else {
            const span = document.createElement('span');
            span.className = 'char font-helvetica';
            span.textContent = testText[charIndex];
            container.appendChild(span);
            charIndex++;
          }
        } else {
          clearInterval(typeInterval);
          container.appendChild(cursor);
        }
      }, 50);
    }

    function changeFontOneByOne() {
      let index = 0;

      // 2. 실시간으로 계속 추가되는 .char 요소를 추적하며 한 글자씩 IndiePen으로 교체
      const changeInterval = setInterval(() => {
        const spans = container.querySelectorAll('.char');

        if (index < spans.length) {
          const span = spans[index];
          span.classList.add('changing');

          setTimeout(() => {
            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');
            span.classList.remove('changing');
          }, 50);

          index++;
        } else {
          const totalTargetChars = testText.replace(/<br>/g, '').length;
          if (index >= totalTargetChars) {
            clearInterval(changeInterval);
            // 모든 글자 변환이 끝나면 3초 후 전체 애니메이션을 다시 재시작합니다.
            setTimeout(runAnimation, 3000);
          }
        }
      }, 90);
    }

    /* ---------------------------------------------------------
       진단 패널: 주소 끝에 ?debug 를 붙이면 화면 아래에 표시됩니다.
       각 폰트 파일이 이 브라우저에서 색이 나오는지 한눈에 확인할 수 있어요.
       --------------------------------------------------------- */
    async function showDebug() {
      if (!/[?&]debug/.test(location.search)) return;

      const chars = getSampleChars();
      const panel = document.createElement('div');
      panel.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;max-height:55vh;overflow:auto;z-index:9999;' +
        'padding:10px 14px;background:#fff;color:#000;border-top:1px solid #000;' +
        'font:12px/1.5 ui-monospace,Menlo,monospace;text-align:left;white-space:pre-wrap;';

      const supports = (q) => { try { return CSS.supports(q); } catch (e) { return 'error'; } };
      const info = document.createElement('div');
      info.textContent =
        `engine: ${document.documentElement.dataset.engine || 'other'}\n` +
        `선택된 패밀리: ${document.documentElement.dataset.colorFont}\n` +
        `font-tech(color-COLRv1): ${supports('font-tech(color-COLRv1)')}\n` +
        `font-tech(color-COLRv0): ${supports('font-tech(color-COLRv0)')}\n` +
        `font-tech(color-SVG): ${supports('font-tech(color-SVG)')}\n` +
        `UA: ${navigator.userAgent}`;
      panel.appendChild(info);

      for (const family of FAMILY_CANDIDATES) {
        try { await document.fonts.load(`32px "${family}"`, chars); } catch (e) {}
        const status = Array.from(document.fonts)
          .filter(f => f.family.replace(/["']/g, '') === family)
          .map(f => f.status).join(',') || '선언 없음';

        const row = document.createElement('div');
        row.style.cssText = 'margin-top:8px;';
        const label = document.createElement('div');
        label.textContent = `${family}  |  상태: ${status}  |  canvas 컬러 감지: ${rendersColor(family, chars)}`;
        const sample = document.createElement('div');
        sample.style.cssText = `font:32px/1.2 "${family}", monospace;white-space:normal;word-break:break-all;`;
        sample.textContent = 'AaaA a4@ [rel4]tionship';
        row.append(label, sample);
        panel.appendChild(row);
      }
      // 본문과 같은 CSS 속성을 하나씩 켜서, 어느 속성에서 검정으로 바뀌는지 확인
      const current = document.documentElement.dataset.colorFont;
      const testFamily = FAMILY_CANDIDATES.includes(current) ? current : 'IndiePenSVG';
      const variants = [
        ['A. 폰트만', ''],
        ['B. + font-palette: normal', 'font-palette:normal;'],
        ['C. + font-feature-settings calt', 'font-feature-settings:"calt" 1;'],
        ['D. + font-synthesis: none', 'font-synthesis:none;'],
        ['E. + position:relative; top; transition', 'position:relative;top:0;transition:top .15s ease;'],
        ['F. + forced-color-adjust: none', 'forced-color-adjust:none;'],
        ['G. + font-weight: normal', 'font-weight:normal;']
      ];

      const head = document.createElement('div');
      head.style.cssText = 'margin-top:14px;font-weight:bold;';
      head.textContent = `속성별 테스트 (패밀리: ${testFamily}) - 어느 줄부터 검정인가요?`;
      panel.appendChild(head);

      for (const [name, css] of variants) {
        const row = document.createElement('div');
        row.style.cssText = 'margin-top:6px;';
        const label = document.createElement('div');
        label.textContent = name;
        const sample = document.createElement('span');
        sample.style.cssText = `font-family:"${testFamily}",monospace;font-size:32px;line-height:1.2;${css}`;
        sample.textContent = 'AaaA a4@ [rel4]tionship';
        row.append(label, sample);
        panel.appendChild(row);
      }

      document.body.appendChild(panel);
    }

    async function init() {
      // 폰트 감지가 너무 오래 걸려도 애니메이션은 4초 안에 시작
      await Promise.race([
        prepareFont(),
        new Promise(resolve => setTimeout(resolve, 4000))
      ]);
      runAnimation();
      showDebug();
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
