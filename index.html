<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>

  <style>

    /* ==========================================
       폰트
       ========================================== */

    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }


    /* ==========================================
       전체 초기화
       ========================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* ==========================================
       BODY
       ========================================== */

    body {
      background-color: #ffffff;
      color: #000000;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      /* 가로 스크롤 방지 */
      overflow-x: hidden;

      /* 세로 스크롤 허용 */
      overflow-y: auto;
    }


    /* ==========================================
       텍스트 전체 영역
       
       flex를 쓰지 않고 일반 인라인 흐름으로 둔다.
       IndiePen의 calt가 이웃 글자를 인식하려면
       일반적인 텍스트 흐름이 필요하다.
       ========================================== */

    .text-container {

      /* ★ 글자 크기 */
      font-size: 3.4rem;

      text-align: left;

      /* ★ 행간
         1.0 = 좁음
         1.1 = 현재
         1.3 = 조금 넓음
         1.5 = 넓음 */
      line-height: 1.1;

      padding: 80px 20px;

      min-height: 120px;
      width: 100%;

      white-space: pre-wrap;
      word-break: break-word;
    }


    /* ==========================================
       Helvetica
       ========================================== */

    .font-helvetica {
      font-family:
        'Helvetica Neue',
        Helvetica,
        Arial,
        sans-serif;

      font-weight: bold;
    }


    /* ==========================================
       IndiePen
       ========================================== */

    .font-indiepen {
      font-family:
        'IndiePen',
        'Helvetica Neue',
        Helvetica,
        sans-serif;

      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;

      /* ★ OpenType contextual alternates */
      font-feature-settings: "calt" 1;
    }


    /* ==========================================
       각각의 글자
       ========================================== */

    .char {

      /* inline 유지 */
      position: relative;

      top: 0;

      /* ★ 글자가 위로 튀는 애니메이션 속도

         0.15s = 현재
         0.3s  = 느리게
         0.05s = 빠르게 */
      transition: top 0.3s ease;
    }


    /* ==========================================
       IndiePen으로 변환될 때
       글자가 살짝 위로 튀어 오름
       ========================================== */

    .char.changing {

      /* ★ 위로 올라가는 거리

         -0.12em = 현재
         -0.05em = 조금 움직임
         -0.2em  = 많이 움직임 */
      top: -0.05em;
    }


    /* ==========================================
       커서
       ========================================== */

    .cursor {
      display: inline-block;

      width: 3px;

      /* ★ 커서 높이 */
      height: 3.5rem;

      background-color: #000000;

      margin-left: 4px;

      /* ★ 커서 깜빡임 속도

         0.8s = 현재
         0.5s = 빠르게
         1.2s = 느리게 */
      animation: blink 0.8s infinite;

      vertical-align: middle;
    }


    /* ==========================================
       커서 깜빡임
       ========================================== */

    @keyframes blink {

      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }


    /* ==========================================
       클릭 후 입력 가능한 텍스트
       ========================================== */

    .interactive-text {

      font-family:
        'IndiePen',
        'Helvetica Neue',
        Helvetica,
        sans-serif;

      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;

      font-feature-settings: "calt" 1;

      outline: none;

      cursor: text;

      white-space: pre-wrap;

      /* ★ 클릭 후 입력 상태에서도
         자동 애니메이션과 같은 행간을 유지 */
      line-height: 1.1;
    }


    .interactive-text:focus {
      outline: none;
    }

  </style>
</head>


<body>


  <!-- ==========================================
       텍스트가 들어가는 영역
       ========================================== -->

  <div
    class="text-container"
    id="text-container">
  </div>


  <script>


    /* ==========================================
       텍스트 (HTML 태그를 완전히 제거하고 엔터값만 남겼습니다)
       ========================================== */

    const testText = `AaaA is a type:face th4t s3parates the 1dentity of
@a character fr0m its v1sual form.
In or+dinary typogr4phy,) every letter carrie(s its own shape, 
its own identity, its own pl^ace in the alph4bet.
A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#.`;


    /* ==========================================
       두 번째 문장
       ========================================== */

    const secondText =
      `Try typing it yourself!`;


    /* ==========================================
       HTML 요소
       ========================================== */

    const container =
      document.getElementById('text-container');


    /* ==========================================
       타이머 변수
       ========================================== */

    let changeTimeout = null;

    let typeInterval = null;

    let changeInterval = null;

    let secondTypeInterval = null;

    let secondChangeInterval = null;


    /* ==========================================
       인터랙션 여부
       
       false = 자동 애니메이션
       true  = 사용자가 클릭해서 직접 입력
       ========================================== */

    let interactiveMode = false;



    /* ==================================================
       전체 애니메이션 시작
       ================================================== */

    function runAnimation() {


      /* 사용자가 이미 클릭했다면 다시 시작하지 않음 */

      if (interactiveMode) return;


      /* 기존 타이머 제거 */

      clearAllIntervals();


      if (changeTimeout) {

        clearTimeout(changeTimeout);

        changeTimeout = null;
      }


      /* 화면 초기화 */

      container.innerHTML = '';


      let charIndex = 0;



      /* ==================================================
         1. 설명문 타이핑
         ================================================== */

      typeInterval = setInterval(() => {


        if (interactiveMode) return;


        if (charIndex < testText.length) {


          /* ==========================================
             줄바꿈(\n) 처리 (기존 <br> 대신 실제 엔터를 감지하도록 수정)
             ========================================== */

          if (testText[charIndex] === '\n') {

            const br =
              document.createElement('br');

            container.appendChild(br);

            charIndex++;


          } else {


            /* ==========================================
               일반 글자
               ========================================== */

            const span =
              document.createElement('span');

            span.className =
              'char font-helvetica';

            span.textContent =
              testText[charIndex];

            container.appendChild(span);

            charIndex++;
          }


        } else {


          /* 타이핑 완료 */

          clearInterval(typeInterval);

          typeInterval = null;
        }


      /* ==========================================
         ★ 설명문 타이핑 속도

         70ms = 현재

         숫자를 작게:
         → 빠르게 타이핑

         숫자를 크게:
         → 느리게 타이핑
         ========================================== */

      }, 60);



      /* ==================================================
         2. 설명문 IndiePen 변환 시작 대기
         ================================================== */

      changeTimeout = setTimeout(() => {


        if (!interactiveMode) {

          changeFontOneByOne();
        }


      /* ==========================================
         ★ 설명문 완독 후 변환이 시작될 때까지의 대기 시간

         1000ms = 1초 후 변환 시작 */

      }, 1000);

    }



    /* ==================================================
       3. 설명문 글꼴 한 글자씩 IndiePen으로 변경
       ================================================== */

    function changeFontOneByOne() {


      if (interactiveMode) return;


      const spans =
        container.querySelectorAll('.char');

      let spanIndex = 0;


      changeInterval = setInterval(() => {


        if (interactiveMode) return;


        if (spanIndex < spans.length) {


          const currentSpan =
            spans[spanIndex];


          /* 'changing' 클래스를 넣어 위로 점프 */

          currentSpan.classList.add(
            'changing'
          );


          /* 서체를 IndiePen으로 교체 */

          currentSpan.classList.remove(
            'font-helvetica'
          );

          currentSpan.classList.add(
            'font-indiepen'
          );


          /* 점프 후 약간의 딜레이를 두고 제자리로 복귀 */

          setTimeout(() => {

            currentSpan.classList.remove(
              'changing'
            );

          }, 300);


          spanIndex++;


        } else {


          /* 모든 글자 변환 완료 */

          clearInterval(changeInterval);

          changeInterval = null;


          /* 변환 완료 후 1.5초 대기했다가 두 번째 문장 출력 */

          changeTimeout = setTimeout(() => {

            if (!interactiveMode) {

              startSecondSentence();
            }

          }, 1500);

        }


      /* ==========================================
         ★ 글꼴 변환 속도

         40ms = 현재
         ========================================== */

      }, 40);

    }



    /* ==================================================
       4. 두 번째 문장 ("Try typing it yourself!") 세팅
       ================================================== */

    function startSecondSentence() {


      if (interactiveMode) return;


/* 부드럽게 지우지 않고 즉시 리셋 후 두 번째 타이핑 시작 */
container.innerHTML = '';
let secondCharIndex = 0;
secondTypeInterval = setInterval(() => {
if (interactiveMode) return;
if (
secondCharIndex <
secondText.length
) {
if (
secondText[secondCharIndex] ===
'\n'
) {
const br =
document.createElement('br');
container.appendChild(br);
secondCharIndex++;
} else {
const span =
document.createElement('span');
span.className =
'char font-helvetica';
span.textContent =
secondText[secondCharIndex];
container.appendChild(span);
secondCharIndex++;
}
} else {
clearInterval(
secondTypeInterval
);
secondTypeInterval = null;
/* 두 번째 문장 변환 대기 (1초) */
changeTimeout = setTimeout(() => {
if (!interactiveMode) {
changeSecondFontOneByOne();
}
}, 1000);
}
}, 60);
}
/* ==================================================
5. 두 번째 문장 글꼴 한 글자씩 IndiePen으로 변경
================================================== */
function changeSecondFontOneByOne() {
if (interactiveMode) return;
const spans =
container.querySelectorAll('.char');
let spanIndex = 0;
secondChangeInterval =
setInterval(() => {
if (interactiveMode) return;
if (spanIndex < spans.length) {
const currentSpan =
spans[spanIndex];
currentSpan.classList.add(
'changing'
);
currentSpan.classList.remove(
'font-helvetica'
);
currentSpan.classList.add(
'font-indiepen'
);
setTimeout(() => {
currentSpan.classList.remove(
'changing'
);
}, 300);
spanIndex++;
} else {
clearInterval(
secondChangeInterval
);
secondChangeInterval = null;
/* 커서 생성 */
const cursor =
document.createElement('span');
cursor.className = 'cursor';
container.appendChild(cursor);
/* 모든 애니메이션이 정상 종료되면 4초 후 무한 루프 재시작 */
changeTimeout = setTimeout(() => {
if (!interactiveMode) {
runAnimation();
}
}, 4000);
}
}, 40);
}
/* ==================================================
6. 인터랙티브 입력 모드로 전환 (클릭 시)
================================================== */
function switchToInteractive() {
if (interactiveMode) return;
interactiveMode = true;
/* 실행 중이던 모든 타이머 완전 정지 */
clearAllIntervals();
if (changeTimeout) {
clearTimeout(changeTimeout);
changeTimeout = null;
}
/* 컨테이너 내부를 비우고 가독성을 위한 contenteditable div 주입 */
container.innerHTML = '';
const editableDiv =
document.createElement('div');
editableDiv.className =
'interactive-text';
editableDiv.contentEditable = 'true';
/* 포커스를 줘서 바로 타이핑할 수 있게 유도 */
container.appendChild(editableDiv);
setTimeout(() => {
editableDiv.focus();
}, 10);
}
/* ==================================================
기타 유틸리티: 모든 타이머 청소
================================================== */
function clearAllIntervals() {
if (typeInterval) {
clearInterval(typeInterval);
typeInterval = null;
}
if (changeInterval) {
clearInterval(changeInterval);
changeInterval = null;
}
if (secondTypeInterval) {
clearInterval(
secondTypeInterval
);
secondTypeInterval = null;
}
if (secondChangeInterval) {
clearInterval(
secondChangeInterval
);
secondChangeInterval = null;
}
}
/* ==================================================
이벤트 리스너: 화면의 아무 곳이나 누르면 직접 입력 모드 진입
================================================== */
window.addEventListener(
'click',
switchToInteractive
);
/* 최초 실행 트리거 */
runAnimation();


  </script>

</body>
</html>
