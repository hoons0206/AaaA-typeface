<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IndiePen Font Tester</title>
  <style>
    /* 1. 커스텀 폰트 정의 */
   @font-face {
  font-family: 'IndiePen';
  src: url('./IndiePen-Regular-COLR.otf') format('opentype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}

/* 중복된 .font-indiepen 정의는 하나로 합치기 */
.font-indiepen {
  font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
  font-weight: normal;      /* 볼드 금지 */
  font-synthesis: none;     /* 가짜 볼드/이탤릭 생성 방지 */
  font-palette: normal;
}

.font-helvetica {
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: bold;        /* 볼드는 Helvetica 쪽에만 */
}

    @font-palette-values --palette-1 {
    font-family: "IndiePen Regular";
    base-palette: 1;
    /**
     * Use this to override colors of a palette:
     * override-colors:
     *     0         /* Index of the color */
     *     #ff0000;  /* New color value */
     */
}

.palette-1 {
    font-palette: --palette-1;
}
    /* 기본 레이아웃 설정 (흰색 배경, 검은색 글자) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 글자 컨테이너 */
    .text-container {
      font-size: 3.5rem;
      font-weight: bold;
      text-align: center;
      line-height: 1.4;
      padding: 20px;
      word-break: break-word;
      min-height: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    /* 각 글자 스팬(span) 및 전환 모션 */
    .char {
      display: inline-block;
      transition: transform 0.15s ease, font-family 0.1s ease;
      white-space: pre;
    }

    /* 글자가 바뀔 때 아주 살짝 움직이는 효과 */
    .char.changing {
      transform: scale(1.15);
    }

    /* 커서 애니메이션 */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 글자가 출력될 영역 -->
  <div class="text-container" id="text-container"></div>

  <script>
    // 테스트할 문구
    const testText = "IndiePen Regular COLR Font";

    const container = document.getElementById('text-container');

    function runAnimation() {
      container.innerHTML = '';

      // 커서 생성
      const cursor = document.createElement('span');
      cursor.className = 'cursor';

      let charIndex = 0;

      // 1. Helvetica 폰트로 한 글자씩 타이핑
      const typeInterval = setInterval(() => {
        if (charIndex < testText.length) {
          const char = testText[charIndex];
          const span = document.createElement('span');
          span.className = 'char font-helvetica';
          span.textContent = char;
          
          container.appendChild(span);
          charIndex++;
        } else {
          clearInterval(typeInterval);
          container.appendChild(cursor);
          
          // 타이핑 끝난 뒤 0.5초(500ms) 후에 폰트 전환 시작
          setTimeout(changeFontOneByOne, 500);
        }
      }, 70); // 글자 타이핑 속도 (ms)
    }

    function changeFontOneByOne() {
      const spans = container.querySelectorAll('.char');
      let index = 0;

      // 2. 한 글자씩 IndiePen 폰트로 교체
      const changeInterval = setInterval(() => {
        if (index < spans.length) {
          const span = spans[index];

          span.classList.add('changing');

          setTimeout(() => {
            span.classList.remove('font-helvetica');
            span.classList.add('font-indiepen');
            span.classList.remove('changing');
          }, 100);

          index++;
        } else {
          clearInterval(changeInterval);

          // 전환 완료 후 3초 뒤에 처음부터 다시 반복
          setTimeout(runAnimation, 3000);
        }
      }, 90); // 글자 전환되는 속도 (ms)
    }

    // 페이지 로드 시 시작
    window.onload = runAnimation;
  </script>
</body>
</html>
