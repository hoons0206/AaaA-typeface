<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AaaA Typeface</title>
  <style>
    @font-face {
      font-family: 'IndiePen';
      src: url('./IndiePen-Regular-COLR.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* flex를 쓰지 않고 일반 인라인 흐름으로 둔다 (calt가 이웃 글자를 보려면 필요) */
  .text-container {
  font-size: 3.5rem;
  text-align: center;
  line-height: 1.4;
  padding: 80px 20px;
  min-height: 120px;
  width: 100%;
  white-space: pre-wrap;
  word-break: break-word;
}

    .font-helvetica {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: bold;
    }

    .font-indiepen {
      font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
      font-weight: normal;
      font-synthesis: none;
      font-palette: normal;
      font-feature-settings: "calt" 1;
    }

    /* 글자 span: inline 유지 (inline-block/transform 금지) */
    .char {
      position: relative;
      top: 0;
      transition: top 0.15s ease;
    }

    /* 바뀔 때 살짝 튀어 오르는 효과 */
    .char.changing {
      top: -0.12em;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 3.5rem;
      background-color: #000000;
      margin-left: 4px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .interactive-text {
  font-family: 'IndiePen', 'Helvetica Neue', Helvetica, sans-serif;
  font-weight: normal;
  font-synthesis: none;
  font-palette: normal;
  font-feature-settings: "calt" 1;

  outline: none;
  cursor: text;
  white-space: pre-wrap;
}

.interactive-text:focus {
  outline: none;
}
    
  </style>
</head>
<body>

  <div class="text-container" id="text-container"></div>

<script>
  const testText = `AaaA is a type:face th4t s3parates the 1dentity of @a character fr0m its v1sual form.<br>
In or+dinary typogr4phy,) eve;ry letter carrie(s its o$wn shape, its own identity, its own pl^ace in the alph4bet.<br>
A is A, B is B, C is C. AaaA br3aks this [rel4]tionship apart!#.`;

  const secondText = `Try typing it yourself!`;

   const container = document.getElementById('text-container');

  let changeTimeout = null;

  // 현재 진행 중인 애니메이션들을 저장
  let typeInterval = null;
  let changeInterval = null;
  let secondTypeInterval = null;
  let secondChangeInterval = null;

  // 사용자가 직접 입력 모드인지
  let interactiveMode = false;


  // ==========================================
  // 전체 애니메이션 시작
  // ==========================================

  function runAnimation() {

    if (interactiveMode) return;

    clearAllIntervals();

    if (changeTimeout) {
      clearTimeout(changeTimeout);
    }

    container.innerHTML = '';

    let charIndex = 0;


    // ==========================================
    // 1. 설명문 타이핑
    // ==========================================

    typeInterval = setInterval(() => {

      if (interactiveMode) return;

      if (charIndex < testText.length) {

        if (testText.substring(charIndex, charIndex + 4) === '<br>') {

          const br = document.createElement('br');
          container.appendChild(br);

          charIndex += 4;

        } else {

          const span = document.createElement('span');

          span.className = 'char font-helvetica';
          span.textContent = testText[charIndex];

          container.appendChild(span);

          charIndex++;
        }

      } else {

        clearInterval(typeInterval);
        typeInterval = null;
      }

    }, 70);


    // ==========================================
    // 2. 타이핑 시작 후 1.5초
    // 설명문 IndiePen 변환 시작
    // ==========================================

    changeTimeout = setTimeout(() => {

      if (!interactiveMode) {
        changeFontOneByOne();
      }

    }, 1500);
  }


  // ==========================================
  // 설명문 IndiePen 변환
  // ==========================================

  function changeFontOneByOne() {

    let index = 0;

    changeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(changeInterval);
        return;
      }

      const spans = container.querySelectorAll('.char');

      if (index < spans.length) {

        const span = spans[index];

        span.classList.add('changing');

        setTimeout(() => {

          if (interactiveMode) return;

          span.classList.remove('font-helvetica');
          span.classList.add('font-indiepen');

          span.classList.remove('changing');

        }, 100);

        index++;

      } else {

        const totalTargetChars =
          testText.replace(/<br>/g, '').length;

        if (index >= totalTargetChars) {

          clearInterval(changeInterval);
          changeInterval = null;

          // 설명문 전체 변환 완료
          // 1.5초 후 Try 문장 시작

          setTimeout(() => {

            if (!interactiveMode) {
              typeSecondText();
            }

          }, 1500);
        }
      }

    }, 100);
  }


  // ==========================================
  // 3. Try typing it yourself!
  // 타이핑
  // ==========================================

  function typeSecondText() {

    if (interactiveMode) return;

    let secondIndex = 0;

    secondTypeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(secondTypeInterval);
        return;
      }

      if (secondIndex < secondText.length) {

        const span = document.createElement('span');

        span.className = 'char font-helvetica second-text';
        span.textContent = secondText[secondIndex];

        container.appendChild(span);

        secondIndex++;

      } else {

        clearInterval(secondTypeInterval);
        secondTypeInterval = null;

        // 타이핑 완료 후 1.5초
        setTimeout(() => {

          if (!interactiveMode) {
            changeSecondFont();
          }

        }, 1500);
      }

    }, 35);
  }


  // ==========================================
  // 4. Try 문장 빠르게 IndiePen 변환
  // ==========================================

  function changeSecondFont() {

    if (interactiveMode) return;

    const spans = container.querySelectorAll('.char');

    const firstTextLength =
      testText.replace(/<br>/g, '').length;

    const secondSpans =
      Array.from(spans).slice(firstTextLength);

    let index = 0;

    secondChangeInterval = setInterval(() => {

      if (interactiveMode) {
        clearInterval(secondChangeInterval);
        return;
      }

      if (index < secondSpans.length) {

        const span = secondSpans[index];

        span.classList.add('changing');

        setTimeout(() => {

          if (interactiveMode) return;

          span.classList.remove('font-helvetica');
          span.classList.add('font-indiepen');

          span.classList.remove('changing');

        }, 40);

        index++;

      } else {

        clearInterval(secondChangeInterval);
        secondChangeInterval = null;

        // 변환 완료 후 3초 뒤 반복
        setTimeout(() => {

          if (!interactiveMode) {
            runAnimation();
          }

        }, 3000);
      }

    }, 35);
  }


  // ==========================================
  // 5. Try 문장을 클릭하면 인터랙티브 모드
  // ==========================================

  container.addEventListener('click', function(event) {

    /*
     * Try 문장이 존재하는지 확인
     */
    const allSpans = Array.from(
      container.querySelectorAll('.char')
    );

    const secondSpans = allSpans.filter(span =>
      span.classList.contains('second-text')
    );

    if (secondSpans.length === 0) {
      return;
    }


    /*
     * 클릭한 위치가 Try 문장인지 확인
     */
    const clickedSpan = event.target.closest('.second-text');

    if (!clickedSpan) {
      return;
    }


    activateInteractiveMode(event, secondSpans);
  });


  // ==========================================
  // 인터랙티브 입력 모드 활성화
  // ==========================================

  function activateInteractiveMode(event, secondSpans) {

    if (interactiveMode) return;

    interactiveMode = true;

    // 모든 자동화 중지
    clearAllIntervals();

    if (changeTimeout) {
      clearTimeout(changeTimeout);
      changeTimeout = null;
    }


    /*
     * 클릭 위치를 기준으로
     * Try 문장 안에서 몇 번째 글자인지 계산
     */

    let characterIndex = 0;

    const clickedSpan = event.target.closest('.second-text');

    if (!clickedSpan) return;


    const clickedIndex =
      secondSpans.indexOf(clickedSpan);


    if (clickedIndex === -1) return;


    /*
     * 글자의 어느 위치를 클릭했는지 계산
     *
     * 글자 왼쪽을 클릭하면 그 글자 앞,
     * 오른쪽을 클릭하면 그 글자 뒤에 커서를 둔다.
     */

    const rect = clickedSpan.getBoundingClientRect();

    const clickX = event.clientX;

    const middleX =
      rect.left + rect.width / 2;


    if (clickX >= middleX) {
      characterIndex = clickedIndex + 1;
    } else {
      characterIndex = clickedIndex;
    }


    /*
     * 클릭한 위치 이전의 텍스트만 남긴다.
     */

    const currentText =
      secondSpans
        .map(span => span.textContent)
        .join('');

    const textBeforeCursor =
      currentText.substring(0, characterIndex);


    /*
     * 기존 Try 문장 span들을 제거
     */

    secondSpans.forEach(span => {
      span.remove();
    });


    /*
     * contenteditable 생성
     */

    const editable =
      document.createElement('span');

    editable.className = 'interactive-text';

    editable.contentEditable = 'true';

    editable.spellcheck = false;

    editable.textContent = textBeforeCursor;


    /*
     * 클릭했던 위치에 interactive 영역 삽입
     */

    container.appendChild(editable);


    /*
     * 커서를 원하는 위치로 이동
     */

    editable.focus();

    const selection = window.getSelection();
    const range = document.createRange();

    range.selectNodeContents(editable);

    range.collapse(false);

    selection.removeAllRanges();
    selection.addRange(range);


    /*
     * 이후 사용자가 입력할 때
     * IndiePen이 계속 유지됨
     */

    editable.addEventListener('input', function() {

      /*
       * contenteditable 내부에서
       * 폰트가 바뀌지 않도록 강제
       */

      editable.style.fontFamily =
        "'IndiePen', 'Helvetica Neue', Helvetica, sans-serif";

    });
  }


  // ==========================================
  // 모든 자동화 중지
  // ==========================================

  function clearAllIntervals() {

    if (typeInterval) {
      clearInterval(typeInterval);
      typeInterval = null;
    }

    if (changeInterval) {
      clearInterval(changeInterval);
      changeInterval = null;
    }

    if (secondTypeInterval) {
      clearInterval(secondTypeInterval);
      secondTypeInterval = null;
    }

    if (secondChangeInterval) {
      clearInterval(secondChangeInterval);
      secondChangeInterval = null;
    }
  }


  window.onload = runAnimation;
</script>
</body>
</html>
